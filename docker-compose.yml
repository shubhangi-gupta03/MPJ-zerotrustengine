services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - zero-trust-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - zero-trust-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    ports:
      - "6379:6379"
    networks:
      - zero-trust-net

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zerotrust}
      MYSQL_USER: ${MYSQL_USER:-zt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zt_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-zt_user} -p$${MYSQL_PASSWORD:-zt_password}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - zero-trust-net

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin_password}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand(\"ping\").ok' | mongosh mongodb://$${MONGO_INITDB_ROOT_USERNAME:-admin}:$${MONGO_INITDB_ROOT_PASSWORD:-admin_password}@localhost:27017/admin --quiet | grep 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - zero-trust-net

  eureka-server:
    build:
      context: ./backend
      dockerfile: ./eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - zero-trust-net

  api-gateway-service:
    build:
      context: ./backend
      dockerfile: ./api-gateway-service/Dockerfile
    container_name: api-gateway-service
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      device-trust-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
    networks:
      - zero-trust-net

  auth-service:
    build:
      context: ./backend
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      MYSQL_USER: ${MYSQL_USER:-zt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zt_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    networks:
      - zero-trust-net

  device-trust-service:
    build:
      context: ./backend
      dockerfile: ./device-trust-service/Dockerfile
    container_name: device-trust-service
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin_password}
    networks:
      - zero-trust-net

  behavior-service:
    build:
      context: ./backend
      dockerfile: ./behavior-service/Dockerfile
    container_name: behavior-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8083:8080"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin_password}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-kafka_user}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-kafka_password}
    networks:
      - zero-trust-net

  risk-scoring-service:
    build:
      context: ./backend
      dockerfile: ./risk-scoring-service/Dockerfile
    container_name: risk-scoring-service
    depends_on:
      behavior-service:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8084:8080"
    environment:
      MODEL_SIGNING_KEY: ${MODEL_SIGNING_KEY:-change_me_model_signing_key}
    networks:
      - zero-trust-net

  policy-engine-service:
    build:
      context: ./backend
      dockerfile: ./policy-engine-service/Dockerfile
    container_name: policy-engine-service
    depends_on:
      risk-scoring-service:
        condition: service_started
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8085:8080"
    environment:
      MYSQL_USER: ${MYSQL_USER:-zt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zt_password}
      POLICY_SIGNING_SECRET: ${POLICY_SIGNING_SECRET:-change_me_policy_signing_secret}
    networks:
      - zero-trust-net

  event-streaming-service:
    build:
      context: ./backend
      dockerfile: ./event-streaming-service/Dockerfile
    container_name: event-streaming-service
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8086:8080"
    environment:
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-kafka_user}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-kafka_password}
    networks:
      - zero-trust-net

  monitoring-service:
    build:
      context: ./backend
      dockerfile: ./monitoring-service/Dockerfile
    container_name: monitoring-service
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8087:8080"
    environment:
      MONITORING_API_TOKEN: ${MONITORING_API_TOKEN:-change_me_monitoring_token}
      MYSQL_USER: ${MYSQL_USER:-zt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zt_password}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin_password}
    networks:
      - zero-trust-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: frontend
    depends_on:
      api-gateway-service:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      FRONTEND_API_TOKEN: ${FRONTEND_API_TOKEN:-change_me_frontend_token}
    networks:
      - zero-trust-net

networks:
  zero-trust-net:
    driver: bridge
